# Despliegue a producción (HU-01-08).
#   develop → staging: lo hace Render solo, cuando el commit pasa el CI (blueprints
#             backend/render.yaml y web/render.yaml con autoDeployTrigger: checksPass).
#   main    → producción: este workflow, después de que alguien apruebe el entorno `produccion`.
# La API (backend/) y el panel (web/) corren en Render. Los servicios de producción tienen el
# despliegue automático apagado y se disparan aquí con sus deploy hooks. La app (mobile/) se
# publica aparte (apk.yml para pruebas). Si faltan los secretos, el paso se salta con un aviso.
# Ver docs/operacion/despliegue.md.
name: Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: despliegue-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-backend:
    uses: ./.github/workflows/ci-backend.yml

  ci-web:
    uses: ./.github/workflows/ci-web.yml

  desplegar:
    name: Desplegar en producción
    needs: [ci-backend, ci-web]
    runs-on: ubuntu-24.04
    environment:
      name: produccion
      url: ${{ vars.PANEL_URL }}
    env:
      RENDER_DEPLOY_HOOK_API: ${{ secrets.RENDER_DEPLOY_HOOK_API }}
      RENDER_DEPLOY_HOOK_WEB: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@v5

      - name: API en Render
        if: env.RENDER_DEPLOY_HOOK_API != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_API&ref=$GITHUB_SHA" > /dev/null
      - name: Esperar a que la API responda con esta versión
        if: env.RENDER_DEPLOY_HOOK_API != '' && env.API_URL != ''
        run: bash .github/scripts/esperar-version.sh "$API_URL/salud" "$GITHUB_SHA"

      - name: Panel en Render
        if: env.RENDER_DEPLOY_HOOK_WEB != ''
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_WEB&ref=$GITHUB_SHA" > /dev/null

      - name: Avisar si faltan secretos
        if: env.RENDER_DEPLOY_HOOK_API == '' || env.RENDER_DEPLOY_HOOK_WEB == ''
        run: >
          echo "::warning::Faltan secretos del entorno produccion (RENDER_DEPLOY_HOOK_API o
          RENDER_DEPLOY_HOOK_WEB); se omitió parte del despliegue. Ver docs/operacion/despliegue.md."
