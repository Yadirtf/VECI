# Blueprint de Render (HU-01-08): API de staging y de producción a partir del Dockerfile.
# El despliegue no es automático en Render: lo dispara GitHub Actions (deploy.yml) con el
# deploy hook de cada servicio, después de que el CI pasa (y de la aprobación en producción).
# Las variables marcadas sync: false se llenan a mano en el panel de Render.
services:
  - type: web
    name: veci-api-staging
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    region: ohio
    plan: free
    autoDeploy: false
    healthCheckPath: /salud
    envVars:
      - key: VECI_ENTORNO
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_APP_URL
        sync: false
      - key: VECI_ORIGENES
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: '0.1'

  - type: web
    name: veci-api-produccion
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    region: ohio
    plan: starter
    autoDeploy: false
    healthCheckPath: /salud
    envVars:
      - key: VECI_ENTORNO
        value: produccion
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_APP_URL
        sync: false
      - key: VECI_ORIGENES
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: '0.1'
