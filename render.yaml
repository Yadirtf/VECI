# Blueprint de Render para staging (HU-01-08): la API (backend/) y el panel (web/) en un solo
# paso. En Render: New → Blueprint, este repositorio y la rama develop; Render lee este archivo
# de la raíz sin configurar nada más. Cada servicio se construye solo desde su carpeta
# (rootDir) y se despliega cuando un commit en develop pasa el CI (autoDeployTrigger: checksPass).
#
# La base es PostgreSQL 16 administrado en Neon (ver docs/operacion/despliegue.md). Al arrancar,
# la API aplica las migraciones, crea el usuario veci_api con la clave generada abajo y carga
# los datos de ejemplo. Solo hay que pegar DATABASE_URL.
services:
  # API · backend/
  - type: web
    name: veci-api-staging
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: ohio
    plan: free
    branch: develop
    autoDeployTrigger: checksPass
    healthCheckPath: /salud
    envVars:
      - key: VECI_ENTORNO
        value: staging
      # Cadena de conexión del dueño en Neon (neondb_owner), con ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Clave del usuario veci_api; la API arma su conexión con ella (sin BYPASSRLS).
      - key: VECI_API_DB_PASSWORD
        generateValue: true
      # Firma de los tokens de sesión (EP-02). Mínimo 32 caracteres; Render la genera.
      - key: VECI_TOKENS_SECRETO
        generateValue: true
      - key: VECI_SEMBRAR_DEMO
        value: 'true'
      # URL del panel (CORS). Si Render le asigna otra, cámbiela aquí.
      - key: VECI_ORIGENES
        value: https://veci-web-staging.onrender.com
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: '0.1'

  # Panel · web/
  - type: web
    name: veci-web-staging
    runtime: node
    rootDir: web
    region: ohio
    plan: free
    branch: develop
    autoDeployTrigger: checksPass
    # pnpm por npx con la versión de package.json; la versión del panel es el commit.
    buildCommand: >-
      npx --yes pnpm@10.28.0 install --frozen-lockfile &&
      NEXT_PUBLIC_VECI_VERSION=$RENDER_GIT_COMMIT npx --yes pnpm@10.28.0 build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: '22'
      # Las NEXT_PUBLIC_* se usan al construir: si cambian, hay que redesplegar el panel.
      # URL de la API. Si Render le asigna otra a veci-api-staging, cámbiela aquí.
      - key: NEXT_PUBLIC_VECI_API_URL
        value: https://veci-api-staging.onrender.com
      - key: NEXT_PUBLIC_VECI_ENTORNO
        value: staging
      - key: NEXT_PUBLIC_SENTRY_DSN
        sync: false
