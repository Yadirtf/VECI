# Reglas de análisis de la app (sección 5.3.4 y HU-01-10). Las de tamaño de archivos y
# funciones y los límites entre capas los revisa tool/verificar_arquitectura.py.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - build/**
    - packages/veci_api/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_return: error
    dead_code: error

formatter:
  page_width: 100

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
