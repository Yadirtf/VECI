name: veci
description: "VECI: la app del cajero y del cliente. Un vecino aliado para los negocios del Putumayo."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  device_info_plus: ^13.3.0
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  http: ^1.6.0
  path_provider: ^2.1.6
  sentry_flutter: ^9.30.1
  veci_api:
    path: packages/veci_api

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
