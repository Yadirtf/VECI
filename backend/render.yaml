# Blueprint de Render para el backend (HU-01-08). En Render: New → Blueprint, este
# repositorio y la ruta backend/render.yaml. Crea la API de staging, que se despliega sola
# cuando un commit en develop pasa el CI (autoDeployTrigger: checksPass).
#
# La base es PostgreSQL 16 administrado en Neon (ver docs/operacion/despliegue.md). Al
# arrancar, el contenedor aplica las migraciones, crea el usuario veci_api con la clave
# generada abajo y carga los datos de ejemplo. Solo hay que pegar DATABASE_URL.
services:
  - type: web
    name: veci-api-staging
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: ohio
    plan: free
    branch: develop
    autoDeployTrigger: checksPass
    healthCheckPath: /salud
    envVars:
      - key: VECI_ENTORNO
        value: staging
      # Cadena de conexión del dueño en Neon (neondb_owner), con ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Clave del usuario veci_api; la API arma su conexión con ella (sin BYPASSRLS).
      - key: VECI_API_DB_PASSWORD
        generateValue: true
      - key: VECI_SEMBRAR_DEMO
        value: 'true'
      # URL del panel (CORS). Si Render le asigna otra, cámbiela aquí.
      - key: VECI_ORIGENES
        value: https://veci-web-staging.onrender.com
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: '0.1'
